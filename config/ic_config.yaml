# IC Gatekeeper 預設設定
version: "1.0"  # 設定版本

# 全域預設
global:
  default_method: "spearman"  # 預設相關係數方法
  default_horizon: 5  # 預設 horizon
  time_duration_mode: false  # 是否使用時間語義

# 預處理
preprocessing:
  # LA-0 RULING-3：default unset（fail-closed）；orchestrator 注入
  # train_mask（split ON）/ pit_expanding（split OFF）/ full_sample（fallback 逃生）
  # 禁把此欄改成 global pit_expanding 預設
  fit_mode: "unset"
  winsorization:
    enabled: true  # 是否啟用極端值截斷
    method: "percentile"  # percentile | mad | zscore | none
    lower_percentile: 1.0  # 下截斷百分位
    upper_percentile: 99.0  # 上截斷百分位
  missing_values:
    max_fill_forward: 3  # 前向填補上限
    min_coverage: 0.3  # 最低覆蓋率

# Label 設定
labels:
  return_type: "simple"  # simple | log | excess | risk_adjusted（winsorized 已禁用 LA-2 DEC-1）
  horizons: [1, 2, 3, 5, 8, 13, 21]  # bar 數 horizon
  horizons_time: null  # 時間語義 horizon (可選)

# 事件過濾
event_filter:
  enabled: false  # 是否啟用事件過濾
  query: null  # 事件條件
  min_events: 30  # 最低事件數
  sample_size_tiers:
    sufficient: 200  # 樣本充分
    marginal: 100  # 樣本邊界
    low_confidence: 30  # 低信心

# IC 計算
ic_calculation:
  methods: ["spearman"]  # 計算方法
  rolling_windows: [21, 63, 126]  # Rolling 視窗
  rolling_stride: 1  # Rolling stride
  ic_decay_horizons: [1, 2, 3, 5, 8, 13, 21]  # IC Decay horizons
  icir:
    window: 63  # ICIR Rolling window
    reference_tf: "12h"  # ICIR 參考 TF
  grouped_analysis:
    by_year: true  # 依年份
    by_quarter: false  # 依季度
    by_regime: true  # 依市場狀態
    by_volatility: false  # Phase 0 migration: volatility grouped is fail-closed until implemented
    by_category: true  # 依指標類別
    by_data_source: true  # 依資料來源
    by_layer: true  # 依 pipeline layer
    regime_method: "rule"  # rule=規則式(bull/bear/vol), kmeans=K-Means無監督聚類
    regime_definitions:
      bull: "close > close_EMA_55"
      bear: "close < close_EMA_55"
      high_vol_percentile: 80
      low_vol_percentile: 20
    regime_kmeans:
      n_clusters: 4  # 聚類數量（4=高波趨勢/中波趨勢/中波盤整/低波盤整）
      lookback: 55  # 特徵計算回看窗口
      min_samples_for_fit: 100  # 最少樣本數才進行聚類
      refit_interval: 50  # Segment-causal refit 間隔（固定常數，禁依 n 推導）

# 篩選門檻
thresholds:
  ic_mean_min: 0.02  # IC 平均下限
  icir_min: 0.5  # ICIR 下限
  p_value_max: 0.05  # p-value 上限
  ic_hit_rate_min: 0.55  # IC 正報率下限
  monotonicity_score_min: 0.6  # 單調性分數下限
  coverage_min: 0.5  # 覆蓋率下限
  long_short_spread:
    enabled: false  # 是否啟用 Long-Short Spread
    min_spread: 0.01  # 最低 spread

# 冗餘去除
redundancy:
  method: "greedy"  # greedy | hierarchical | vif
  correlation_threshold: 0.7  # 相關性門檻
  tiebreaker: "icir"  # icir | ic_mean | monotonicity
  hierarchical:
    linkage_method: "average"  # 叢集連結方法
  vif:
    max_vif: 10.0  # VIF 上限
  diversification:
    min_categories: 3  # 類別最少數
    min_data_sources: 2  # 資料源最少數
    max_same_category_pct: 0.4  # 同類別上限比例

# 換手率
turnover:
  enabled: true  # 是否啟用換手率
  transaction_cost: 0.001  # 交易成本

# 報告
report:
  top_n_features: 30  # Top N
  include_decay_analysis: true  # IC Decay
  include_quantile_curves: true  # 分位數收益曲線
  include_correlation_heatmap: true  # 相關性熱力圖
  include_regime_analysis: true  # Regime 分析
  include_layer_analysis: true  # Layer 分析
  include_turnover_analysis: true  # 換手率分析
  ai_summary: true  # AI 摘要

# 效能設定
performance:
  parallel_ic_calculation: true  # 平行計算 IC
  n_jobs: -1  # CPU 併行數

# --- Phase 2.4 深度分析 Config ---
# F5.2: enabled=true 最終 flip(F0-F4 全綠後;§R 回退=revert F5.2 commit)
# tier truth: foundation 不含; intermediate/advanced/custom 含(且 enabled=true 才入 run)
factor_return:
  enabled: true
  num_quantiles: 5
  calculate_risk_metrics: true
  risk_free_rate: 0.0
  warmup_periods: 20
  min_samples: 30

factor_centrality:
  enabled: true
  n_components: 5
  rolling_window: 60
  crowded_threshold: 0.3
  min_samples_for_pca: 30

trend_analysis:
  enabled: true
  min_samples: 20
  significance_level: 0.05
  r_squared_threshold: 0.1
  dimensions: ["ic", "centrality", "factor_return", "ls_spread"]

parameter_sensitivity:
  enabled: true
  min_family_size: 3
  ic_std_threshold_low: 0.02
  ic_std_threshold_high: 0.05
  auto_detect_families: true

rolling_oos:
  enabled: true
  train_window: 252
  test_window: 63
  step: 21
  min_splits: 5
  assessment_thresholds:
    robust_hit_rate: 0.7
    robust_max_degradation: 0.3
    moderate_hit_rate: 0.5
    moderate_max_degradation: 0.5

# --- Phase 2.5 深度分析 Config ---
factor_orthogonalization:
  enabled: false
  method: "gram_schmidt"

factor_exposure:
  enabled: false
  max_single_exposure: 0.4
  neutralization_mode: "none"
  neutralization_lookback: 63

long_short_analysis:
  enabled: true
  num_quantiles: 5
  long_quantiles: [4, 5]
  short_quantiles: [1, 2]

feature_quality_diagnostics:
  enabled: true
  adf_significance: 0.05
  ljungbox_lags: 10
  ljungbox_significance: 0.05
  coverage_threshold: 0.8
  drift_window: 60
  drift_threshold: 0.25
  redundancy_threshold: 0.85

net_ic_analysis:
  enabled: true
  cost_enabled: false
  cost_bps: null
  participation_rate: 0.01

# === 功能層級管理 ===
feature_tiers:
  active_preset: "intermediate"  # foundation | intermediate | advanced | custom
  presets:
    foundation:
      description: "基礎分析：IC/ICIR/篩選核心流程"
      deep_analysis: false
      disabled_modules: []
    intermediate:
      description: "進階分析：含深度分析常用模組"
      deep_analysis: true
      disabled_modules: [factor_orthogonalization, factor_exposure]
    advanced:
      description: "完整分析：全部功能"
      deep_analysis: true
      disabled_modules: []
  custom_overrides:
    stage_overrides: {}
    module_overrides: {}

# --- Global ---
deep_analysis_global:
  timeout_overrides: {}
  regime_aware: false
