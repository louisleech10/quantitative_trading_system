version: "2.2"

global:
  sequence_length: 100
  max_lag_ratio: 0.5
  lag_strategy: "adaptive"
  custom_lags: null

data_sources:
  enabled_sources:
    - close
    - volume
    - taker_ratio
  synthetic_sources:
    - avg-price
    - med-price
    - typ-price
    - wcl-price
  adapters:
    crypto_spot:
      enabled: true
      class: "CryptoSpotAdapter"
    crypto_deriv:
      enabled: false
      class: "CryptoDerivAdapter"

timeframes:
  primary: "12h"
  training: ["12h"]
  alignment: "point_in_time"
  alignment_mode: "open_minus"

atomic_indicators:
  trend:
    enabled: true
    indicators:
      - name: EMA
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [10, 20, 50, 100, 200]
      - name: SMA
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [10, 20, 50, 100, 200]
      - name: WMA
        periods: fibonacci
        period_range: [5, 233]
      - name: DEMA
        periods: fibonacci
        period_range: [5, 233]
      - name: TEMA
        periods: fibonacci
        period_range: [5, 233]
      - name: TRIMA
        periods: fibonacci
        period_range: [5, 233]
      - name: KAMA
        periods: fibonacci
        period_range: [5, 233]
      - name: T3
        periods: fibonacci
        period_range: [5, 233]
        vfactor: [0.7]
      - name: MAMA
        fastlimit: [0.5]
        slowlimit: [0.05]
      - name: HT_TRENDLINE
      - name: MIDPOINT
        periods: fibonacci
        period_range: [5, 233]
      - name: MIDPRICE
        periods: fibonacci
        period_range: [5, 233]
      - name: SAR
        acceleration: [0.01, 0.02, 0.03]
        maximum: [0.1, 0.2, 0.3]
      - name: SAREXT
        acceleration: [0.01, 0.02, 0.03]
        maximum: [0.1, 0.2, 0.3]
      - name: BBANDS
        periods: [13, 20, 21, 34, 55, 89, 144, 233]
        stddev: [1.0, 1.5, 2.0, 2.5, 3.0]
      - name: MAVP
        periods: fibonacci
        period_range: [5, 233]
      - name: MA
        periods: fibonacci
        period_range: [5, 233]
        matype: [0, 1, 2, 3, 4]

  momentum:
    enabled: true
    indicators:
      - name: RSI
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [6, 7, 9, 14, 25]
      - name: MACD
        # 全尺度覆蓋：超短 / 短 / 中 / 長 / 超長 (fast < slow, signal 相對 fast 約 1/3~1/2)
        combos:
          - [5,  13,  3]   # 超短期
          - [5,  21,  5]   # 短期
          - [8,  21,  5]   # 短-中
          - [8,  34,  9]   # 短-中偏長
          - [12, 26,  9]   # 經典（保留）
          - [13, 34,  9]   # Fibonacci 經典
          - [13, 55, 13]   # 短 vs 月線
          - [21, 55,  9]   # 中期
          - [21, 89, 13]   # 中-長
          - [34, 89, 13]   # 中長期
          - [34,144, 21]   # 長期
          - [55,144, 21]   # 長 vs 超長
          - [55,233, 34]   # 超長期
      - name: MACDEXT
        # 同 MACD 全尺度覆蓋（fast/slow/signal）
        combos:
          - [5,  13,  3]
          - [5,  21,  5]
          - [8,  21,  5]
          - [8,  34,  9]
          - [12, 26,  9]
          - [13, 34,  9]
          - [13, 55, 13]
          - [21, 55,  9]
          - [21, 89, 13]
          - [34, 89, 13]
          - [34,144, 21]
          - [55,144, 21]
          - [55,233, 34]
      - name: MACDFIX
        # signal period only；fast=12/slow=26 已固定
        periods: [3, 5, 8, 9, 13, 21]
      - name: ADX
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: ADXR
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: DX
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: PLUS_DI
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: MINUS_DI
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: PLUS_DM
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: MINUS_DM
        periods: [8, 13, 14, 21, 34, 55, 89, 144, 233]
      - name: CCI
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [14, 20]
      - name: CMO
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [14]
      - name: MOM
        periods: fibonacci
        period_range: [5, 233]
      - name: ROC
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [9, 12]
      - name: ROCP
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [9, 12]
      - name: ROCR
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [9, 12]
      - name: ROCR100
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [9, 12]
      - name: APO
        # Absolute Price Oscillator: [fast, slow]，同 MACD 微分結構但無 signal
        combos:
          - [5,  13]
          - [5,  21]
          - [8,  21]
          - [8,  34]
          - [12, 26]
          - [13, 34]
          - [13, 55]
          - [21, 55]
          - [21, 89]
          - [34, 89]
          - [34,144]
          - [55,144]
          - [55,233]
      - name: PPO
        # Percentage Price Oscillator: 同 APO 結構
        combos:
          - [5,  13]
          - [5,  21]
          - [8,  21]
          - [8,  34]
          - [12, 26]
          - [13, 34]
          - [13, 55]
          - [21, 55]
          - [21, 89]
          - [34, 89]
          - [34,144]
          - [55,144]
          - [55,233]
      - name: AROON
        periods: [13, 14, 21, 25, 34, 55, 89, 144, 233]
      - name: AROONOSC
        periods: [13, 14, 21, 25, 34, 55, 89, 144, 233]
      - name: BOP
      - name: TRIX
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]
      - name: ULTOSC
        # Ultimate Oscillator: [short, medium, long]，對比 ~1:2:4，國際經典 [7,14,28]
        combos:
          - [5,  10, 20]   # 1:2:4
          - [5,  13, 26]   # Fibonacci 影響
          - [7,  14, 28]   # Williams 原版經典
          - [8,  21, 55]   # Fibonacci 
          - [13, 21, 55]   # 中程尺度
          - [13, 34, 89]   # Fibonacci 長期
          - [21, 34, 89]   # 長期
          - [21, 55,144]   # 超長
          - [34, 55,144]   # 超長偏短
          - [34, 89,233]   # 極長期
      - name: WILLR
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [10, 14, 20]
      - name: MFI
        periods: [8, 13, 14, 21, 34, 55, 89]
      - name: STOCH
        # [fastk_period, slowk_period, slowd_period]
        # fastk: 主要 K 線回望期 Fibonacci，slowk/slowd: 小型平滑期間
        combos:
          - [5,  3, 3]
          - [8,  3, 3]
          - [13, 3, 3]
          - [13, 5, 3]
          - [21, 3, 3]
          - [21, 5, 3]
          - [21, 5, 5]
          - [34, 5, 3]
          - [34, 5, 5]
          - [55, 5, 5]
          - [55, 8, 5]
          - [89, 8, 5]
      - name: STOCHF
        # [fastk_period, fastd_period]
        # fastk: Fibonacci 全尺度，fastd: 小型平滑
        combos:
          - [5,  3]
          - [8,  3]
          - [13, 3]
          - [21, 3]
          - [21, 5]
          - [34, 5]
          - [55, 5]
          - [89, 8]
      - name: STOCHRSI
        # [timeperiod, fastk_period, fastd_period]
        # timeperiod: RSI 計算透滤器 Fibonacci，fastk/fastd: 平滑期間
        combos:
          - [9,  5, 3]
          - [14, 5, 3]
          - [14, 3, 3]
          - [21, 5, 3]
          - [21, 8, 5]
          - [34, 8, 5]
          - [55, 8, 5]

  volatility:
    enabled: true
    indicators:
      - name: ATR
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [14, 20]
      - name: NATR
        periods: fibonacci
        period_range: [5, 233]
        industry_standard: [14, 20]
      - name: TRANGE
      - name: Keltner
        # EMA 期段涉及短/中/長，atr_multiplier 控制通道寬度
        ema_periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]
        atr_multiplier: [1.0, 1.5, 2.0, 2.5]
      - name: Donchian
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]
      - name: Parkinson_Vol
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]
      - name: GarmanKlass_Vol
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]

  volume:
    enabled: true
    indicators:
      - name: OBV
      - name: AD
      - name: ADOSC
        # AD Oscillator: [fast_period, slow_period] for AD line EMA smoothing
        # fast/slow 過濿AD線，同 MACD 的短 vs 長 EMA 概念
        combos:
          - [3,  8]
          - [3, 13]
          - [5, 13]
          - [5, 21]
          - [8, 21]
          - [8, 34]
          - [13, 34]
          - [13, 55]
          - [21, 55]
      - name: VWAP
      - name: Volume_MA_Ratio
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]
      - name: Force_Index
        ema_periods: [2, 5, 13, 21, 55, 89, 144, 233]
      - name: Klinger_Volume_Osc
      - name: Ease_of_Movement
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]

  cycle:
    enabled: true
    indicators:
      - name: HT_DCPERIOD
      - name: HT_DCPHASE
      - name: HT_PHASOR
      - name: HT_SINE
      - name: HT_TRENDMODE

  pattern:
