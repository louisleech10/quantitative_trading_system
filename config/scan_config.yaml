      - name: BETA
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]
      - name: CORREL
        periods: [5, 8, 13, 21, 34, 55, 89, 144, 233]

  microstructure:
    enabled: false
    windows: [5, 13, 21, 55]
    epsilon: 1.0e-10
    min_trades: 1
    enabled_features: all
    cs_spread_smooth: [5, 13, 21]
    ofi_raw: true
    kyle_lambda_windows: [13, 21, 55]
    vpin_n_buckets: [30, 50]
    vpin_zscore_windows: [21, 55]

  entropy:
    enabled: false
    windows: [55, 100]
    n_bins: 10
    apen_m: 2
    apen_r_ratio: 0.2
    hurst_windows: [55, 100, 200]
    fractal_kmax: 10
    use_numba: true
    perm_m: 3
    perm_windows: [21, 55, 100]
    apply_to:
      - close_return
      - volume
      - taker_ratio
    shannon_windows: [21, 55, 100]

  tail_risk:
    enabled: false
    windows: [21, 55, 100]
    cvar_alphas: [0.01, 0.05]
    rv_windows: [13, 21, 55]
    mdd_windows: [21, 55, 100]

preprocessing:
  enabled: true
  mode: replace
  ic_first_pipeline: false  # true = IC-First 兩段式（IC 選特徵 → 只對選出特徵做 rank/zscore）；false = legacy（所有特徵全做 L6.5）

  winsorization:
    enabled: true
    method: quantile
    sigma_k: 3.0
    quantile_range: [0.01, 0.99]
    apply_to: all

  adf_differencing:
    enabled: false
    # 0.10 為業界常用顯著水準；金融序列難以通過嚴格的 0.05 檢定（如 EMA_89/100）
    adf_threshold: 0.10
    max_diff: 2
    sample_size: 500
    apply_to: non_stationary

  fractional_differencing:
    enabled: false
    d_range: [0.0, 1.0]
    # 0.10 同上，避免長週期 EMA 無法找到有效 d*
    adf_threshold: 0.10
    weight_threshold: 1.0e-5
    precision: 0.02
    apply_to: non_stationary
    cache_d_star: true

  rank_transform:
    enabled: true
    window: 252
    apply_to: all

  gaussian_normalize:
    enabled: false
    clip_range: [0.001, 0.999]
    apply_to: all

  adaptive_zscore:
    enabled: true
    windows: [100, 252]
    epsilon: 1.0e-8
    apply_to: all

  # ADF / Fracdiff safe-skip whitelist
  # 對數學上嚴格 I(0) 欄位（嚴格有界 / 數學差分 / 共整合差）bypass ADF
  # 詳見 docs/NAN_REDUCTION_STRATEGY.md §4.5
  adf_safe_skip:
    enabled: true
    additional_patterns: []  # 額外擴增 skip pattern（substring match）
    exclusion_patterns: []   # 強制讓 whitelist 命中項回到 ADF（debug 用）

operators:
  distance:
    enabled: true
    apply_to: all_trend
  cross:
    enabled: true
    pairs: auto
  momentum:
    enabled: true
    # L2 momentum: Fibonacci 全尺度，與 L3 rolling windows 一致
    lags: [3, 5, 8, 13, 21, 34, 55, 89, 144, 233]
    apply_to: all
  ratio:
    enabled: true
    pairs: auto
  binary_signal:
    enabled: true
    rules:
      - indicator: RSI
        condition: "> 70"
        name_suffix: "Overbought"
      - indicator: RSI
        condition: "< 30"
        name_suffix: "Oversold"
      - indicator: ADX
        condition: "> 25"
        name_suffix: "Strong_Trend"
      - indicator: CCI
        condition: "> 100"
        name_suffix: "Overbought"
      - indicator: CCI
        condition: "< -100"
        name_suffix: "Oversold"
      - indicator: MFI
        condition: "> 80"
        name_suffix: "Overbought"
      - indicator: MFI
        condition: "< 20"
        name_suffix: "Oversold"
  worldquant:
    enabled: true

rolling_aggregation:
  enabled: true
  # Fibonacci 全尺度：極短(3,5,8) / 短(13,21) / 中(34,55) / 長(89,144) / 超長(233)
  windows: [3, 5, 8, 13, 21, 34, 55, 89, 144, 233]
  aggregators:
    - slope
    - std
    - mean
    - rank
    - zscore
    - skew
    - kurt
    - min
    - max
    - range
  apply_to: all
  # Layer 4 pipeline gate: skip skew/kurt for columns with at most this many
  # distinct non-NaN values. Rolling skew/kurt of a binary/near-binary signal
  # (e.g. HT-TRENDMODE regime flag) is degenerate-by-construction — mostly NaN
  # in constant runs, statistically meaningless elsewhere. 2 = block binary;
  # 0 disables the gate (no-op).
  skip_higher_moments_max_cardinality: 2

lag_features:
  enabled: true
  apply_to: layer1_and_raw

cross_sectional:
  enabled: false
  reference_symbol: BTCUSDT
  features: [relative_price, beta, idiosyncratic_momentum]

meta_features:
  enabled: true
  trend_consensus: true
  momentum_divergence: true
  volume_price_divergence: true
  time_features: true
  volatility_regime: true

labels:
  binary:
    horizons: [3, 5, 8, 13, 21]
    threshold: 0.0
  regression:
    horizons: [5, 13]

custom_indicators: []

# NaN 處理策略：cascade blacklist + L7 dead feature drop
# 詳見 docs/NAN_REDUCTION_STRATEGY.md §5
nan_strategy:
  # Cascade categorical blacklist：阻斷「計算本身錯誤」的下游 derivation
  # （CDL rolling/diff/lag ≈ 全零；HT_DCPHASE 0-360° 翻轉處算錯）
  # L1 原始欄位保留於最終 feature store。
  categorical_blacklist:
    - CDL_PATTERN_ALL
    - HT-DCPHASE   # hyphen：對照真實 catalog 命名（close_12h_cycle_HT-DCPHASE）

  # L7 write 前的死特徵清理：僅丟常數欄與樣本不足欄，不依 NaN ratio
  l7_dead_feature_drop:
    enabled: true
    min_valid_samples: 100

  # Layer B 通用數值淨化（CGSA L7 write 前最後防線）：±inf / |v|>finite_cap → NaN，
  # 覆蓋所有 streamed 特徵（含 L3）。攔截 Layer A（kernel √n 界 + 除法近零守衛）
  # 漏掉的 overflow stragglers。Class B 真實大值（如 volume VAR ~3e10）遠低於 cap → 保留。
  numeric_sanitize:
    enabled: true
    finite_cap: 1.0e18
