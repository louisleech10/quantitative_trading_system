plan_id: feature-factory-optimization
objective: |
  實作 Feature Factory 效能優化方案 M（Hybrid — CGSA + Polars + Numba + searchsorted），
  將 ETHUSDT 2TF pipeline 從 170+ min 降至 ~7 min，同時滿足：
  數值完全等價(C1)、不減特徵(C2)、不改欄位名(C3)、RAM ≤ 6GB(C4)、無 future leakage(C5)、NaN 語義一致(C6)。
  全程由 AI Agent 自動執行，包含 98 項測試（38 單元 + 35 邊界 + 12 整合 + 5 golden 等價 + 8 效能）。
created_at: "2026-04-12T18:00:00"
created_by: gem-planner
status: approved
research_confidence: high

plan_metrics:
  wave_1_task_count: 6
  total_dependencies: 48
  risk_score: medium

tldr: |
  6 Phase 漸進式效能優化，每 Phase 有獨立 gate 決策點：
  - Phase 0: 可觀測性建設（log + golden output）— 零風險
  - Phase 1: searchsorted + skip self-align — 省 7.5 min
  - Phase 2: CGSA 架構（ColumnGroup 串流）— 消除 global concat，170 min → 20 min
  - Phase 3: Numba 融合 rolling — L3 385s → 60s
  - Phase 4: Polars L2/L6.5（條件性）— 僅在 re-profile 確認瓶頸時推進
  - Phase 5: 生產化（multi-symbol parallel + DuckDB）
  每 Phase 附帶完整測試 + 邊界測試 + 自我審查 checkbox。

open_questions:
  - "現行 pipeline 能否跑完全量 config 產生 golden output？若 OOM 需用 reduced config"
  - "TA-Lib 是否 thread-safe？影響 Task 1.5 ThreadPoolExecutor 決策"
  - "Phase 4 是否需要推進？取決於 Phase 3 後的 re-profile 結果"

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "searchsorted ms→ns 精度導致 off-by-one，C1 數值不等價"
      likelihood: medium
      impact: high
      mitigation: "T1.2 offset 測試 + T1.B14 精確邊界測試；fallback env FFACT_USE_SEARCHSORTED=0"
    - scenario: "CGSA per-group persist 產生 ~4500 小 Parquet 檔案，IO 效能下降"
      likelihood: medium
      impact: medium
      mitigation: "可合併相同 indicator 的 groups 到一個 Parquet；monitor IO throughput"
    - scenario: "Numba fused rolling skew/kurt 數值不穩定，atol=1e-4 fail"
      likelihood: medium
      impact: high
      mitigation: "Pebay + 每 W 步校正 + float64 累加器；fallback FFACT_USE_NUMBA_ROLLING=0"
    - scenario: "現行 pipeline OOM → 無法建立完整 golden output"
      likelihood: high
      impact: critical
      mitigation: "用 reduced config golden；分層 golden（L1/L3/final）"
    - scenario: "L2 Cross/Ratio 跨 group 依賴在 CGSA 中產生資料競爭"
      likelihood: low
      impact: high
      mitigation: "L2 Stage A 保留 L1 全量 RAM（87 MB），Stage B 才釋放；雙軌 A/B 驗證"
    - scenario: "CGSA 雙軌 A/B 同時執行 → RAM 翻倍 → OOM"
      likelihood: medium
      impact: high
      mitigation: "A/B 不同時在記憶體中；legacy 先跑完存 parquet，再跑 CGSA 比對"
    - scenario: "TA-Lib 非 thread-safe，Task 1.5 ThreadPoolExecutor 導致 segfault (R11)"
      likelihood: high
      impact: high
      mitigation: "Task 1.5 標記 OPTIONAL；若實作改用 ProcessPoolExecutor"
    - scenario: "多 TF 平行化時 TA-Lib GIL 競爭，效能無改善 (R6)"
      likelihood: medium
      impact: medium
      mitigation: "改用 ProcessPoolExecutor 而非 ThreadPoolExecutor"
    - scenario: ".npy 中介檔案硬碟暴漲，work_dir 爆滿 (R8)"
      likelihood: low
      impact: medium
      mitigation: "persist 後即刪 + cleanup finally block"
    - scenario: "Numba JIT 首次編譯耗時 ~30s cold start (R12)"
      likelihood: low
      impact: low
      mitigation: "使用 @numba.njit(cache=True) 磁碟快取"
    - scenario: "build_asof_index_map int64 ms→ns 轉換溢出 year>2262 (R13)"
      likelihood: low
      impact: medium
      mitigation: "T1.B15 overflow 測試 + assert year < 2100"
    - scenario: "self-align skip 後 index 對齊不一致，後續 concat 列數不匹配 (R2)"
      likelihood: low
      impact: medium
      mitigation: "T1.B11 index mismatch 測試 + assert len(combined) == len(primary_timestamps)"
    - scenario: "Polars null ≠ NaN 語義差異導致 C6 fail (R5)"
      likelihood: medium
      impact: medium
      mitigation: "T4.B1 null/NaN 驗證 + pl.Series.fill_null(float('nan'))；Phase 4 為條件性，不影響 Phase 2/3"
    - scenario: "materialize_wide_df() 重組 45 萬欄位 Parquet → metadata 極大導致讀取慢 (R10)"
      likelihood: high
      impact: high
      mitigation: "per-group Parquet 已在 CGSA 設計中；materialize_wide_df() 僅供向後相容，新 code 應直接讀 per-group"
  assumptions:
    - "MacBook M1 8GB RAM 環境（留 2GB 給 OS）"
    - "ETHUSDT K-line 資料已在 data_cache/ 中"
    - "scan_config.yaml 為預設設定（全開 L1~L6）"
    - "momentum.core.logging 已可用"
    - "numpy, pandas, numba, h5py 已安裝"
    - "所有 Phase 在獨立 git branch 上開發"

implementation_specification:
  code_structure: |
    新增程式碼位於 momentum/FeatureEngineering/ 下，遵循解耦 7 規則。
    Phase 2 新增 core/ 子目錄（ColumnGroup, Registry）。
    Phase 3 新增 numba/ 子目錄（fused rolling kernels）。
    測試位於 tests/ 頂層，效能測試在 tests/performance/。
    Golden output 位於 data_cache/golden_output/。
    腳本位於 scripts/。
  affected_areas:
    - "momentum/FeatureEngineering/feature_factory.py — L2 計時、L7 per-group validate"
    - "momentum/FeatureEngineering/memmap_utils.py — heartbeat log"
    - "momentum/FeatureEngineering/timeframe/tf_aligner.py — searchsorted align"
    - "momentum/FeatureEngineering/timeframe/multi_tf_generator.py — self-align skip"
    - "momentum/FeatureEngineering/core/ — 新增 ColumnGroup + Registry (Phase 2)"
    - "momentum/FeatureEngineering/operators/rolling_aggregator.py — Numba fused (Phase 3)"
    - "momentum/FeatureEngineering/operators/derived_operators.py — L2 CGSA (Phase 2)"
    - "momentum/FeatureEngineering/preprocessing/feature_preprocessor.py — L6.5 per-group (Phase 2)"
    - "momentum/FeatureEngineering/feature_storage.py — per-group Parquet (Phase 2)"
    - "scripts/generate_golden_output.py — golden baseline"
    - "tests/ — 98 項測試"
  component_details:
    - component: "TimeframeAligner.build_asof_index_map()"
      responsibility: "O(N log M) searchsorted 對齊，替代 merge_asof"
      interfaces:
        - "build_asof_index_map(primary_ts, source_ts, offset_ns) -> np.ndarray"
        - "_searchsorted_align(source_values, source_index, primary_index, offset_ns) -> pd.DataFrame"
    - component: "ColumnGroup + ColumnGroupRegistry"
      responsibility: "CGSA 核心資料結構：immutable group metadata + disk-backed registry"
      interfaces:
        - "ColumnGroup(group_id, layer, timeframe, ...)"
        - "Registry.register(group), .get(group_id), .save_data(), .load_data()"
        - "Registry.materialize_wide_df() -> pd.DataFrame (向後相容)"
    - component: "Numba Fused Rolling"
      responsibility: "單次掃描計算 mean/std/min/max/range/zscore/skew/kurt/rank/slope"
      interfaces:
        - "fused_rolling_stats(data, windows, aggs) -> dict[str, np.ndarray]"
    - component: "Golden Output Generator"
      responsibility: "建立數值基準，用於所有 Phase 的 C1~C6 驗證"
      interfaces:
        - "scripts/generate_golden_output.py → data_cache/golden_output/"
  dependencies:
    - component: "Phase 1 (searchsorted)"
      relationship: "depends on Phase 0 golden output for validation"
    - component: "Phase 2 (CGSA)"
      relationship: "depends on Phase 1 for searchsorted align in non-primary TF"
    - component: "Phase 3 (Numba)"
      relationship: "depends on Phase 2 for per-group data structure"
    - component: "Phase 4 (Polars)"
      relationship: "conditional on Phase 3 re-profile; depends on Phase 2 CGSA"
    - component: "Phase 5 (Production)"
      relationship: "depends on Phase 3 gate decision（Phase 4 conditional）；延用 Phase 2 的 per-group Parquet 產出"
  integration_points:
    - "feature_factory.py _layer7_validate_and_persist — Phase 2 改為 per-group"
    - "tf_aligner.py align_to_primary — Phase 1 切換 searchsorted"
    - "multi_tf_generator.py generate_multi_tf — Phase 1 skip self-align"
    - "rolling_aggregator.py — Phase 3 Numba fused replacement"
    - "momentum/factories.py — Phase 2 新增 create_column_group_registry()"

task_guidelines:
  description: |
    以下規則適用於所有 gem-implementer 任務，由 agent 在執行時自動遵循。
    Gate reviewer 負責驗證每個 task 是否滿足這些全域規則。

  ultra_think_enforcement: |
    每個 implementer task 必須遵循 Ultra Think 3-step（§0.3）：
    Step 1: 生成可運作的程式碼
    Step 2: 自我 review → 列出 To-do
    Step 3: 套用 To-do，產出 production-ready 版本
    完成後在 task comment 中記錄 "Ultra Think ✓"

  pre_commit_checklist: |
    每個 task 完成後必須檢查（§0.13）：
    □ grep -r "from api\." momentum/ → 0 結果（R1）
    □ 無 hardcoded data
    □ 所有函式有 type hints
    □ Error handling 使用 FailureType 分類（適用 I/O tasks）
    □ Logging 使用 momentum.core.logging
    □ 命名符合 §0.6（lowercase_with_underscores for functions/vars）
    □ .npy / .parquet 不在 git track 中
    □ Vectorized ops preferred — pandas/numpy 優先於 Python loop（§0.8）
    □ Architecture/API 變更時更新 docs/（§0.13: ARCHITECTURE.md, DEVELOPMENT_GUIDE.md）
    □ Fallback env var 可切回舊行為（§0.12）

  test_conventions: |
    所有測試任務（focus_area 含 'testing'）必須：
    - 測試函式名：test_{功能}_{場景}
    - 每個 test 有中文 docstring
    - 合成資料用 make_kline_df / make_feature_df fixture（INFRA-T1 提供）
    - 測試可獨立執行（Rule 6: 無需 run_api.py）

  error_handling: |
    涉及 I/O 的 tasks（P0-T3, P2-T2, P2-T8, P5-T1）必須使用 FailureType 分類（§0.4）：
    RATE_LIMIT / NETWORK_ERROR → retryable
    INVALID_SYMBOL / IO_ERROR → not retryable
    明確的 try/except + logger.error(exc_info=True)

  git_branching: |
    每 Phase 在獨立 git branch 上開發（§0.10, §1.2）：
    Phase 0 → perf/phase-0-observability
    Phase 1 → perf/phase-1-searchsorted
    Phase 2 → perf/phase-2-cgsa
    Phase 3 → perf/phase-3-numba-rolling
    Phase 4 → perf/phase-4-polars（條件性）
    Phase 5 → perf/phase-5-production
    Gate 通過後合併到 main。
    連續失敗 3 次以上 → 重新評估該 Phase 技術方案（§1.2.1）。

