cumulative_special_cases:
  OBV:
    family: cumulative
    strategy: burn_in_from_dataset_start
    note: Cumulative sum; only relative changes are meaningful; differs from Binance
      by a constant offset unless started at listing.
  AD:
    family: cumulative
    strategy: burn_in_from_dataset_start
    note: 'Same as OBV: pure accumulator; absolute level not comparable.'
  ADOSC:
    family: cumulative_diff_ema
    strategy: burn_in_from_dataset_start_plus_5x_slow
    note: EMA(fast) - EMA(slow) of AD; level differs but oscillator converges once
      both EMAs settle (~5x slow period).
  VWAP:
    family: cumulative
    strategy: session_reset_or_burn_in_from_dataset_start
    note: Binance UI uses session resets (daily/weekly); for ML use consistent reset
      rule across train/test/live.
pattern_default_warmup_bars: 5
