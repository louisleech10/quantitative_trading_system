_meta:
  generated_by: scripts/verify_l1_warmup_requirements.py
  data_source: symbols=['ETHUSDT', 'BTCUSDT', 'ADAUSDT'] tf=1h
  scale_normalized_error_threshold: 0.005
  eval_window_bars: 1000
  test_periods:
  - 13
  - 55
  - 233
  consolidation: max ratio across symbols (worst case)
  principle: Minimum warmup K (in bars at the indicator's native TF) such that max|test
    - infinite_history_gt| over the eval window is less than THRESHOLD * robust_scale(gt),
    where robust_scale = max(P75(|gt|), std(gt)).
  usage: warmup_bars(indicator, period) = ceil(period * recommended_factor); see momentum/Analysis/warmup_lookup.py
