name: DebugProbe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe stat + gate_check on linux
        run: |
          echo "=== bash version ==="; bash --version | head -1
          echo "=== stat -f %m (macOS 語法) 在 linux ==="
          stat -f %m scripts/gate_check.sh; echo "  rc=$?"
          echo "=== stat -c %Y (linux 語法) ==="
          stat -c %Y scripts/gate_check.sh; echo "  rc=$?"
          echo "=== 直接跑 gate_check(fresh token) 看 exit+stderr ==="
          gd=$(mktemp -d); echo fresh > "$gd/dispatch.token"
          printf '{"tool_name":"Task"}' | GATE_DIR_OVERRIDE="$gd" bash scripts/gate_check.sh; echo "  gate_check rc=$?"
          echo "=== 加 set -x 追哪行出錯 ==="
          printf '{"tool_name":"Task"}' | GATE_DIR_OVERRIDE="$gd" bash -x scripts/gate_check.sh 2>&1 | tail -20
