name: L6.5 Benchmark

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Smoke (${{ matrix.tier }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tier: ['8gb', '16gb']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run L6.5 smoke benchmark
        id: benchmark
        continue-on-error: true
        run: python scripts/benchmark_l65.py --smoke --tier=${{ matrix.tier }}

      - name: Evaluate benchmark result
        id: evaluate
        continue-on-error: true
        run: python -c "import glob,json,sys; paths=glob.glob('benchmark_results/l65/smoke_*.json'); data=json.load(open(max(paths))); print(json.dumps({'status': data.get('status'), 'regression_flag': data.get('regression_flag')}, ensure_ascii=False)); sys.exit(1 if data.get('status') != 'PASS' or data.get('regression_flag') else 0)"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l65-benchmark-${{ matrix.tier }}
          path: benchmark_results/l65/*.json
          if-no-files-found: warn

      - name: Open regression issue
        if: steps.benchmark.outcome == 'failure' || steps.evaluate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'benchmark-regression';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: 'd73a4a',
                  description: 'Automated benchmark regression alert',
                });
              } else {
                throw error;
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `L6.5 Benchmark fail (${{ matrix.tier }})`,
              body: `Nightly L6.5 smoke benchmark failed for tier ${{ matrix.tier }}.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: [labelName],
            });
