name: Verify Claim

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-claim:
    name: Verification claim check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # checker 純標準庫但用 PEP 604(str | None)語法,須 3.10+;不裝 requirements
          # (TA-Lib 等重依賴在 runner 裝不起且 checker 不需要)
          python-version: '3.11'

      - name: Verify jq available
        run: command -v jq

      - name: Determine diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "before=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "before=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verification claim check
        env:
          BEFORE_SHA: ${{ steps.range.outputs.before }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          CHANGED="$(git diff --name-only "${BEFORE_SHA}...${HEAD_SHA}" -- HANDOFF.md 'handoffs/*.md' 'docs/*.md' | tr '\n' ' ')"
          if [ -n "$CHANGED" ]; then
            python scripts/verification_claim_check.py \
              --range "${BEFORE_SHA}...${HEAD_SHA}" \
              --files ${CHANGED}
          else
            # 範圍內無可掃 md(code-only push)=無事可驗,通過;與 pre-commit 同語義,非 fail-open
            echo "no scannable markdown changed in range; nothing to check"
          fi
