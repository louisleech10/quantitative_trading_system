[pytest]
# Pytest 配置文件 - Optuna 優化系統測試
# Author: Claude
# Date: 2025-12-06

# 測試路徑
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 設定 Python 路徑
pythonpath = .

# 默認命令行選項
addopts = -v --tb=short --import-mode=importlib

# 建議 smoke 命令（排除慢測試與舊式腳本測試）
# ./venv/bin/pytest tests/ -m "not slow and not legacy" -x -q --tb=short

# 標記定義
markers =
    slow: 標記為慢速測試 (需要較長執行時間)
    integration: 整合測試 (需要後端運行)
    legacy: 舊式/歷史相容測試 (不納入日常 smoke)
    asyncio: 異步測試
    perf: 效能 microbench (opt-in,非 blocking;跨 tier 計時易波動,不納入正確性 gate)
    ic_run_selector: IC Run 選擇器 config_hash 消歧相關測試
    backward_compat: IC Run 選擇器向後相容 golden (find_latest 不帶 config_hash)
    disambig: IC Run 選擇器消歧 golden (同 symbol+tf 不同 config_hash)
    analyze_real_run: 真實 run 端到端 analyze (label ingestion 不拋錯)
    list_features: list_features timeframe 一致性
    requires_kline: 正確性測試依賴真實 kline；缺檔 FAIL（非 skip）。PR smoke 用 -m "not requires_kline" 排除

# 日誌配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 覆蓋率相關 (需要 pytest-cov)
# 使用: pytest --cov=momentum --cov-report=html
