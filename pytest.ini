[pytest]
# Pytest 配置文件 - Optuna 優化系統測試
# Author: Claude
# Date: 2025-12-06

# 測試路徑
testpaths = tests

# B6 / TC13：mutation_red 已收編入主 suite（不再 norecursedirs 排除）

# Python 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 設定 Python 路徑
pythonpath = .

# 默認命令行選項
addopts = -v --tb=short --import-mode=importlib

# 暫存目錄保留（TESTSEL 2026-11-14）：通過之測試其 tmp_path 於該測試結束即刪、失敗者保留供除錯（pytest ≥7.3 內建）。
# 未設時 pytest 保留每條測試之 tmp_path 至 session 結束：先前部分執行 789–2,303 條即佔 1.9–2.8 GB，
# 全量 1.4 萬條可逾本機剩餘磁碟（曾有暫存塞滿磁碟之事故，見 HANDOFF 坑）。
tmp_path_retention_policy = failed

# 建議 smoke 命令（排除慢測試與舊式腳本測試）
# ./venv/bin/pytest tests/ -m "not slow and not legacy" -x -q --tb=short

# 標記定義
markers =
    slow: 標記為慢速測試 (需要較長執行時間)
    fullscale: 全規模層（有小規模姊妹之全規模測試）；預設延後，加 --run-fullscale 執行；預設層勿以 -m 篩（會使 testmon 停用選取）；與 slow（模組內偏慢）為不同概念
    integration: 整合測試 (需要後端運行)
    legacy: 舊式/歷史相容測試 (不納入日常 smoke)
    asyncio: 異步測試
    perf: 效能 microbench (opt-in,非 blocking;跨 tier 計時易波動,不納入正確性 gate)
    ic_run_selector: IC Run 選擇器 config_hash 消歧相關測試
    backward_compat: IC Run 選擇器向後相容 golden (find_latest 不帶 config_hash)
    disambig: IC Run 選擇器消歧 golden (同 symbol+tf 不同 config_hash)
    analyze_real_run: 真實 run 端到端 analyze (label ingestion 不拋錯)
    list_features: list_features timeframe 一致性
    requires_kline: 正確性測試依賴真實 kline；缺檔 FAIL（非 skip）。PR smoke 用 -m "not requires_kline" 排除
    slow_stat: 統計性質測試（固定 seed/允收帶；單測較長，opt-in 排除可用 -m "not slow_stat"）
    flaky_quarantine: TESTREG 隔離（照跑；票級閘將其失敗列報不擋；須 catalog quarantine 欄之翻轉證據且未逾期，見 docs/TESTREG_SPEC.md）
    limit_rows: ICPERF Task 0.6 L1 列↔測試對應（參數為 L0 機讀表原始三元組 (file, line, code_sha256)；見 docs/ICPERF_SPEC.md Task 0.6 (h)）

# 日誌配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 覆蓋率相關 (需要 pytest-cov)
# 使用: pytest --cov=momentum --cov-report=html
