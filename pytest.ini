[pytest]
# Pytest 配置文件 - Optuna 優化系統測試
# Author: Claude
# Date: 2025-12-06

# 測試路徑
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 設定 Python 路徑
pythonpath = .

# asyncio 模式 - 自動檢測異步測試
asyncio_mode = auto

# 默認命令行選項
addopts = -v --tb=short

# 標記定義
markers =
    slow: 標記為慢速測試 (需要較長執行時間)
    integration: 整合測試 (需要後端運行)
    asyncio: 異步測試

# 過濾警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 日誌配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 覆蓋率相關 (需要 pytest-cov)
# 使用: pytest --cov=momentum --cov-report=html
